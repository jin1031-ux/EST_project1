<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>제주 오늘 뭐 먹지?</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="index">
  <main class="container home">
    <div class="background-scene" aria-hidden="true">
      <span class="orb orb-terracotta"></span>
      <span class="orb orb-gold"></span>
      <span class="orb orb-sage"></span>
      <span class="ribbon ribbon-one"></span>
      <span class="ribbon ribbon-two"></span>
    </div>
    <header><div class="brand-block"><a class="logo" href="index.html">제주 오늘 뭐 먹지?</a><p>제주에서 먹고 싶은 메뉴와 식당을 찾아보세요.</p></div><div id="auth-controls" class="auth-controls"></div></header>
    <section class="search-section" aria-labelledby="main-title">
      <p class="eyebrow">JEJU FOOD GUIDE · 2026</p><h1 id="main-title">제주에서 먹고 싶은<br>메뉴를 골라보세요.</h1>
      <div class="category-section" aria-labelledby="category-title">
        <p id="category-title" class="category-label">어떤 메뉴를 찾으세요?</p>
        <div class="category-list" role="list">
          <button type="button" class="category-chip" data-category="흑돼지" role="listitem">흑돼지</button>
          <button type="button" class="category-chip" data-category="해산물" role="listitem">해산물</button>
          <button type="button" class="category-chip" data-category="고기국수" role="listitem">고기국수</button>
          <button type="button" class="category-chip" data-category="갈치" role="listitem">갈치</button>
          <button type="button" class="category-chip" data-category="브런치" role="listitem">브런치</button>
        </div>
      </div>
      <form id="search-form" class="search-form"><label class="sr-only" for="menu-search">메뉴 또는 식당 검색</label><input id="menu-search" type="search" placeholder="예: 흑돼지, 고기국수, 식당 이름" autocomplete="off"><button type="submit">검색</button></form>
    </section>
    <section class="results-section" aria-live="polite">
      <p id="search-notice" class="search-notice">메뉴 또는 식당 키워드를 검색하면 카카오맵 장소 검색 결과를 보여드려요.</p>
      <section id="search-recommendations" class="search-recommendations" aria-labelledby="search-recommendations-title" hidden>
        <div class="search-results-heading"><div><p class="eyebrow">SERVICE RESTAURANTS</p><h2 id="search-recommendations-title">서비스 등록 식당</h2></div><p>등록된 메뉴와 좌석 상태를 기준으로 찾은 식당</p></div>
        <div id="featured-results" class="restaurant-list featured-results"></div>
      </section>
      <section id="general-results-section" class="general-results-section" aria-labelledby="general-results-title" hidden>
        <div class="search-results-heading"><div><p class="eyebrow">KAKAO MAP SEARCH</p><h2 id="general-results-title">카카오맵 장소 검색 결과</h2></div></div>
        <div class="place-search-layout"><div id="results" class="restaurant-list"></div></div>
      </section>
      <div id="load-more-area" class="load-more-area" hidden>
        <button id="load-more-button" class="load-more-button" type="button">더보기</button>
        <p id="pagination-notice" class="pagination-notice" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="mock-data.js"></script><script src="app.js"></script>
</body>
</html>
